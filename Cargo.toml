[package]
name = "permit-map"
version = "0.1.0"
edition = "2024"
description = "Resolve coding-agent permission files before an agent runs"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-agent-permission-map"
keywords = ["cli", "security", "agents", "permissions"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "examples/sample-repo/**",
    ".factory/brief.json",
    ".factory/claims.json",
    ".factory/copy-audit.md",
    ".factory/demo.md",
    ".factory/design.md",
    ".factory/handoff.md",
    "Cargo.lock",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "!node_modules/**",
]

[[bin]]
name = "permit-map"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
