<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1120" height="560" viewBox="0 0 1120 560">
  <title id="title">Permit Map terminal demo</title>
  <desc id="desc">The real demo command resolves four policy sources, nine effective rules, and one shadowed rule.</desc>
  <rect width="1120" height="560" rx="8" fill="#0b1817"/><rect x="1" y="1" width="1118" height="558" rx="8" fill="none" stroke="#6b827b" stroke-width="2"/>
  <circle cx="32" cy="30" r="7" fill="#bd3a2d"/><circle cx="56" cy="30" r="7" fill="#a66b18"/><circle cx="80" cy="30" r="7" fill="#21653d"/>
<g fill="#e6e9df" font-family="ui-monospace, monospace" font-size="20"><text x="28" y="84" fill="#ecbf69">$</text><text x="52" y="84">permit-map inspect .</text><text x="28" y="130">Permit Map — 4 sources, 9 effective, 1 shadowed</text><text x="28" y="184" fill="#80aaa5">VENDOR    LAYER      EFFECT    STATUS       MATCHER</text><text x="28" y="226">claude    worktree</text><text x="268" y="226" fill="#ff8277">deny</text><text x="380" y="226">effective    Bash(git status:*)</text><text x="28" y="268">claude    repo</text><text x="268" y="268" fill="#72c98b">allow</text><text x="380" y="268">effective    Bash(npm test:*)</text><text x="28" y="310">codex     project</text><text x="268" y="310" fill="#f3c668">ask</text><text x="380" y="310">effective    command:git push</text><text x="28" y="352">codex     project</text><text x="268" y="352" fill="#ff8277">deny</text><text x="380" y="352">effective    command:rm -rf</text><text x="28" y="394">claude    repo</text><text x="268" y="394" fill="#72c98b">allow</text><text x="380" y="394" fill="#eab664">shadowed     Bash(git status:*)</text><text x="380" y="436" fill="#bcc8c3">↳ replaced by .claude/settings.local.json</text></g>
</svg>
